server:
  port: 8080
  servlet:
    context-path: /api/dev

spring:
  application:
    name: Blog-Platform

  devtools:
    restart:
     trigger-file: .reloadtrigger

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format-sql: true
        highlight-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER}
