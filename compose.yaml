volumes:
  auth_data:
    driver: local
    name: auth-data
  app_data:
    driver: local
    name: app-data

networks:
  medium:
    driver: bridge
    name: medium

services:
  # for application data:
  postgres:
    container_name: blog_pg
    image: postgres:latest
    volumes:
      - app_data:/var/lib/postgresql
    networks:
      - medium
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  # for user-authentication through keycloak/Idp:
  postgres_auth:
    container_name: user_pg
    image: postgres:latest
    volumes:
      - auth_data:/var/lib/postgresql
    networks:
      - medium
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # keycloak Idp itself:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_auth:5432/user
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    networks:
      - medium
    depends_on:
      postgres_auth:
        condition: service_healthy
